apiVersion: v1
kind: Service
metadata:
  # This name is what app.js resolves as REDIS_HOST — must stay "redis-service"
  # unless you also change REDIS_HOST in app-deployment.yaml.
  name: redis-service
spec:
  selector:
    app: redis-service
  ports:
    - port: 6379
      targetPort: 6379
  # No "type" set -> defaults to ClusterIP, only reachable from inside the cluster.
  # That's all the app needs; no external exposure for Redis.
