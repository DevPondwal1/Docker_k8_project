apiVersion: v1
kind: Service
metadata:
  name: visitor-counter-app-service
spec:
  selector:
    app: visitor-counter-app
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      # Optional: pin a fixed NodePort in the 30000-32767 range for convenience.
      # If omitted, Kubernetes assigns one automatically.
      nodePort: 30080
